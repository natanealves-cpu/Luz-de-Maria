# Configuração da Netlify.
# O site é estático: não há nada para compilar, os arquivos sobem como estão.

[build]
  publish = "."

# Cabeçalhos de segurança básicos, aplicados a todas as páginas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# -----------------------------------------------------------------------
# Documentação e planilha modelo: continuam no repositório (versionadas e
# acessíveis para quem cuida do site), mas não são servidas ao visitante.
# force = true faz a regra valer mesmo existindo o arquivo.
# -----------------------------------------------------------------------

[[redirects]]
  from = "/LEIA-ME.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PASSO-A-PASSO-GITHUB-NETLIFY.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/modelo-produtos.xlsx"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/img/COMO-USAR.txt"
  to = "/404.html"
  status = 404
  force = true

# Arquivos futuros de documentação: basta guardar dentro da pasta docs/
# que esta única regra já cuida deles.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
