<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <style>
    .erro {
      min-height: 100dvh;

      margin: 0;
      font-family: var(--fonte-titulo);
      font-size: 1.3rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--cor-marca-escura);
    }
    .erro p { margin: 0; color: var(--cor-suave); max-width: 34ch; }
    .erro a {
      margin-top: 1rem;
      padding: .75rem 1.6rem;
      border-radius: 12px;
      background: var(--cor-marca);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    .erro a:hover { background: var(--cor-marca-escura); }
