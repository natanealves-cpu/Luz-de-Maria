<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luz de Maria Boutique Criativa — Loja</title>
  <meta name="description" content="Catálogo da Luz de Maria Boutique Criativa com pedido direto pelo WhatsApp.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#bb8853">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header class="cabecalho">
    <div class="cabecalho__topo container">
      <div class="marca">
        <span class="marca__icone" id="marca-icone" aria-hidden="true">
          <!-- Símbolo da marca: chama e coração em linha contínua -->
          <svg viewBox="0 0 100 100" role="img" aria-hidden="true" focusable="false">
            <g fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 67 C 24 60, 40 62, 50 64 C 62 66, 80 66, 95 61" />
              <path d="M50 80 C 33 69, 29 58, 35.5 51 C 42 44.5, 50 48, 50 56.5
                       C 50 48, 58 44.5, 64.5 51 C 71 58, 67 69, 50 80" />
              <path d="M50 47 C 43.5 38, 45.5 26, 50 17 C 55 26, 56.5 38, 50 47" />
              <path d="M50 45 C 47.5 39, 49.5 33, 50.5 29" />
              <path d="M28 17 C 29 23, 31 25, 37 26 C 31 27, 29 29, 28 35
                       C 27 29, 25 27, 19 26 C 25 25, 27 23, 28 17 Z" />
              <path d="M17 37 C 17.6 40.6, 18.8 41.8, 22.4 42.4 C 18.8 43, 17.6 44.2, 17 47.8
                       C 16.4 44.2, 15.2 43, 11.6 42.4 C 15.2 41.8, 16.4 40.6, 17 37 Z" />
            </g>
          </svg>
        </span>
        <div class="marca__texto">
          <h1 class="marca__nome" id="loja-nome">Luz de Maria</h1>
          <p class="marca__sub" id="loja-sub">Boutique Criativa</p>
        </div>
      </div>

      <button type="button" class="botao-carrinho" id="abrir-carrinho" aria-label="Abrir carrinho">
        <span aria-hidden="true">🛍️</span>
        <span>Carrinho</span>
        <span class="badge" id="badge-carrinho" hidden>0</span>
      </button>
    </div>

    <div class="cabecalho__busca container">
      <div class="campo-busca">
        <span class="campo-busca__icone" aria-hidden="true">🔎</span>
        <input type="search" id="busca" placeholder="Buscar produto..." aria-label="Buscar produto"
               autocomplete="off">
        <button type="button" class="campo-busca__limpar" id="limpar-busca" aria-label="Limpar busca" hidden>×</button>
      </div>
    </div>

    <nav class="filtros container" id="filtros" aria-label="Filtrar por categoria"></nav>
  </header>

  <main class="container">
    <p class="contador" id="contador" role="status" aria-live="polite"></p>
    <ul class="grade" id="grade"></ul>

    <p class="vazio" id="sem-resultado" hidden>
      Nenhum produto encontrado. Tente outra busca ou escolha outra categoria.
    </p>
  </main>

  <footer class="rodape">
    <p class="rodape__slogan" id="loja-slogan"></p>
    <p id="rodape-texto"></p>
    <p class="rodape__aviso">Os pedidos são enviados pelo WhatsApp e confirmados pelo atendimento.</p>
  </footer>

  <!-- Carrinho -->
  <div class="overlay" id="overlay" hidden></div>

  <aside class="carrinho" id="carrinho" role="dialog" aria-modal="true" aria-labelledby="carrinho-titulo" hidden>
    <header class="carrinho__cabecalho">
      <h2 id="carrinho-titulo">Seu pedido</h2>
      <button type="button" class="icone" id="fechar-carrinho" aria-label="Fechar carrinho">×</button>
    </header>

    <div class="carrinho__corpo" id="carrinho-itens"></div>

    <form class="carrinho__rodape" id="form-pedido" novalidate>
      <div class="total">
        <span>Total</span>
        <strong id="total">R$ 0,00</strong>
      </div>

      <label class="campo">
        <span>Seu nome <em>*</em></span>
        <input type="text" id="cliente-nome" name="nome" autocomplete="name" required>
      </label>

      <label class="campo">
        <span>Observações (opcional)</span>
        <textarea id="cliente-obs" name="obs" rows="2"
                  placeholder="Ex.: cor preferida, prazo, forma de retirada..."></textarea>
      </label>

      <p class="erro" id="erro-form" hidden></p>

      <button type="submit" class="botao-principal" id="enviar-pedido" disabled>
        <span aria-hidden="true">💬</span> Enviar pedido pelo WhatsApp
      </button>
      <button type="button" class="botao-texto" id="limpar-carrinho">Esvaziar carrinho</button>
    </form>
  </aside>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/planilha.js"></script>
  <script src="js/loja.js"></script>
</body>
</html>
